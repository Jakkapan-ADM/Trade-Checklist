<style>
:root{--bg:#eef2f1;--panel:#fbfdfc;--line:#d5dedb;--text:#1f2d2b;--mute:#6a7c78;--sel:#dfeee9;--buy:#2f8f6b;--sell:#c5604f;--wait:#b98a2e;--accent:#3c7f87;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b1c;--panel:#1b2425;--line:#2b3837;--text:#dce6e3;--mute:#86989a;--sel:#243a38;--buy:#58c299;--sell:#e58a7a;--wait:#dcb25e;--accent:#6fb4bd}}
:root[data-theme="dark"]{--bg:#141b1c;--panel:#1b2425;--line:#2b3837;--text:#dce6e3;--mute:#86989a;--sel:#243a38;--buy:#58c299;--sell:#e58a7a;--wait:#dcb25e;--accent:#6fb4bd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:22px;margin:0;font-weight:600}
.clock{font-size:13px;color:var(--mute)}
.tools{display:flex;gap:8px}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.ghost:hover{color:var(--text)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid var(--line);transition:border-color .2s}
.step.ok{border-left-color:var(--buy)}.step.bad{border-left-color:var(--sell)}.step.warn{border-left-color:var(--wait)}
.q{font-weight:500;margin:0 0 2px}
.hint{font-size:13px;color:var(--mute);margin:0 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 120px;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);font-weight:500}
.sub{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sub .hint{margin-bottom:8px}
.verdict{border-radius:18px;padding:20px;margin-top:18px;background:var(--panel);border:1px solid var(--line);text-align:center}
.verdict .big{font-size:26px;font-weight:600;margin:0}
.verdict p{margin:4px 0 0;color:var(--mute);font-size:14px}
.verdict.buy{border-color:var(--buy)}.verdict.buy .big{color:var(--buy)}
.verdict.sell{border-color:var(--sell)}.verdict.sell .big{color:var(--sell)}
.verdict.wait{border-color:var(--wait)}.verdict.wait .big{color:var(--wait)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Trade Checklist</h1><div class="clock" id="clock"></div></div>
  <div class="tools"><button class="ghost" id="theme">ธีม</button><button class="ghost" id="reset">เคลียร์</button></div>
</header>

<section class="step" id="s1">
  <p class="q">1. H1 อยู่ฝั่ง Overbought / Oversold ไหม</p>
  <p class="hint">Overbought = ดูฝั่ง Sell · Oversold = ดูฝั่ง Buy</p>
  <div class="opts" data-key="h1">
    <button class="opt" data-v="ob">Overbought</button>
    <button class="opt" data-v="os">Oversold</button>
    <button class="opt" data-v="none">ไม่อยู่ทั้งสองฝั่ง</button>
  </div>
</section>

<section class="step" id="s2">
  <p class="q">2. เข้าออเดอร์ช่วง 2 ทุ่มไหม</p>
  <p class="hint">2 ทุ่ม (20:00) มักมีการเคลื่อนไหวก่อน</p>
  <div class="opts" data-key="time">
    <button class="opt" data-v="yes">ใช่ ตรงช่วงเวลา</button>
    <button class="opt" data-v="no">ไม่ใช่</button>
  </div>
</section>

<section class="step" id="s3">
  <p class="q">3. M5 เกิด CHoCH หรือ BOS ฝั่งไหน</p>
  <p class="hint">เลือกประเภท แล้วเลือกทิศทางของการเบรก</p>
  <div class="opts" data-key="type">
    <button class="opt" data-v="choch">CHoCH</button>
    <button class="opt" data-v="bos">BOS</button>
    <button class="opt" data-v="none">ยังไม่เกิด</button>
  </div>
  <div class="sub" id="dirbox">
    <p class="hint">ทิศทาง</p>
    <div class="opts" data-key="dir">
      <button class="opt" data-v="bull">Bullish (เบรกขึ้น)</button>
      <button class="opt" data-v="bear">Bearish (เบรกลง)</button>
    </div>
  </div>
</section>

<section class="verdict wait" id="verdict">
  <p class="big" id="vt"></p><p id="vd"></p>
</section>
</main>

<script>
(function(){
  var S={h1:null,time:null,type:null,dir:null};
  try{var saved=JSON.parse(localStorage.getItem('tc_state')||'null');if(saved)S=Object.assign(S,saved);}catch(e){}
  var root=document.documentElement;
  try{var th=localStorage.getItem('tc_theme');if(th)root.setAttribute('data-theme',th);}catch(e){}

  function save(){try{localStorage.setItem('tc_state',JSON.stringify(S));}catch(e){}}
  function mark(id,cls){var el=document.getElementById(id);el.className='step '+(cls||'');}

  function render(){
    document.querySelectorAll('.opts').forEach(function(g){
      var k=g.dataset.key;
      g.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-pressed',S[k]===b.dataset.v?'true':'false');});
    });
    var showDir=S.type==='choch'||S.type==='bos';
    document.getElementById('dirbox').style.display=showDir?'block':'none';
    if(!showDir)S.dir=null;

    var bias=S.h1==='ob'?'sell':S.h1==='os'?'buy':null;
    var want=bias==='sell'?'bear':bias==='buy'?'bull':null;

    mark('s1',S.h1==null?'':bias?'ok':'bad');
    mark('s2',S.time==null?'':S.time==='yes'?'ok':'bad');
    var s3='';
    if(S.type==='none')s3='bad';
    else if(showDir&&S.dir){s3=(want&&S.dir===want)?'ok':'warn';}
    mark('s3',s3);

    var v=document.getElementById('verdict'),t=document.getElementById('vt'),d=document.getElementById('vd');
    var cls='wait',title='รอเช็คให้ครบ',desc='ตอบให้ครบ 3 ข้อเพื่อดูสรุป';
    if(S.h1==='none'){cls='wait';title='ยังไม่มีเซ็ตอัพ';desc='H1 ไม่อยู่โซน Overbought/Oversold · รอก่อน';}
    else if(S.time==='no'){cls='wait';title='นอกช่วงเวลา';desc='ไม่ใช่ช่วง 2 ทุ่ม · รอก่อนหรือข้ามรอบนี้';}
    else if(S.type==='none'){cls='wait';title='รอ M5 ยืนยัน';desc='ยังไม่เกิด CHoCH/BOS · ห้ามเข้าก่อน';}
    else if(S.h1&&S.time&&showDir&&S.dir){
      if(S.dir===want){cls=bias;title='เข้าได้ฝั่ง '+bias.toUpperCase();desc='H1 + เวลา + M5 '+(S.type==='choch'?'CHoCH':'BOS')+' ไปทางเดียวกัน';}
      else{cls='wait';title='สัญญาณสวนกัน';desc='M5 เบรกสวนกับฝั่ง H1 ('+(bias||'').toUpperCase()+') · รอก่อน';}
    }
    v.className='verdict '+cls;t.textContent=title;d.textContent=desc;
    save();
  }

  document.querySelectorAll('.opts').forEach(function(g){
    g.addEventListener('click',function(e){
      var b=e.target.closest('.opt');if(!b)return;
      var k=g.dataset.key;S[k]=(S[k]===b.dataset.v)?null:b.dataset.v;render();
    });
  });
  document.getElementById('reset').onclick=function(){S={h1:null,time:null,type:null,dir:null};render();};
  document.getElementById('theme').onclick=function(){
    var cur=root.getAttribute('data-theme');
    var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
    var n=dark?'light':'dark';root.setAttribute('data-theme',n);
    try{localStorage.setItem('tc_theme',n);}catch(e){}
  };

  function tick(){
    try{
      var s=new Date().toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'});
      document.getElementById('clock').textContent='เวลาไทยตอนนี้ '+s+' น.';
    }catch(e){}
  }
  tick();setInterval(tick,30000);
  render();
})();
</script>
</body>
</html>
